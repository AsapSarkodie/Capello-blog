<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign in</title>
    <link rel="stylesheet" href="signUp.css" />
  </head>
  <body>
    <div class="signUp-page">
      <div class="container">
        <img src="" alt="" />
        <h2>SIGN UP</h2>
        <p class="fade">Enter your credentials to continue</p>
        <form class="in" method="post">
          <div>
            <span class="wm"
              ><img
                class="ro"
                src="image/person_2_23dp_000000_FILL0_wght400_GRAD0_opsz24.png"
                alt="" /></span
            ><input name="name" id="me" placeholder="  Name" type="text" />
          </div>
          <div>
            <span class="wm"
              ><img
                class="ro"
                src="image/alternate_email_23dp_000000_FILL0_wght400_GRAD0_opsz24.png"
                alt="" /></span
            ><input
              placeholder="  Email"
              type="email"
              name="email"
              id="input-email"
            />
          </div>
          <div>
            <span class="wm"
              ><img
                class="ro"
                src="image/lock_23dp_000000_FILL0_wght400_GRAD0_opsz24.png"
                alt="" /></span
            ><input
              placeholder="   Password"
              type="password"
              name="Password"
              id="authpassword"
            />
          </div>
          <button name="submit" class="sub" type="submit">Sign Up</button>
        </form>

        <p>Already have an account? <a href="index.html">sign in</a></p>
        <div class="img-con">
          <img
            src="image/DrawKit Vector Illustration Social Work & Charity (9).png"
            alt="illustrator"
          />
        </div>
      </div>
    </div>

    <script src="signup.js"></script>
  </body>
</html>
