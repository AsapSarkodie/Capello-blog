<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testing site</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .boom {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .space {
        width: 95vw;
      }
    </style>
  </head>
  <body>
    <a href="admin.html">Admin page</a>
    <div class="boom">
      <div class="space"></div>
    </div>
    <button>test</button>
    <script>
      let btn = document.querySelector("button");
      let box = document.querySelector(".space");
      const getData = async () => {
        try {
          const poem = await fetch(`http://localhost:5000/poems`);
          const data = await poem.json();

          data.map((pp) => {
            let h3 = document.createElement("h3");
            let p = document.createElement("p");
            let image = document.createElement("img");
            let category = document.createElement("p");
            image.src = `http://localhost:5000/${pp.image_path}`;
            image.style.width = "90px";
            h3.textContent = pp.title;
            p.textContent = pp.content;
            category.textContent = pp.categories;

            box.append(image, h3, p, category);
          });
          console.log(data);
        } catch (error) {
          console.log(error);
        }
      };

      btn.addEventListener("click", getData);
    </script>
  </body>
</html>
